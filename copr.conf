# Settings for copr.sh. Environment variables with the same name override these.
# shellcheck shell=bash

# COPR project that all packages in packages/ are built in. It is created by
# `./copr.sh setup` under your COPR user (see `copr-cli whoami`).
COPR_PROJECT="${COPR_PROJECT:-pkgs-upstream-latest}"

# Build targets (chroots). List what COPR offers with: copr-cli list-chroots
CHROOTS="${CHROOTS:-fedora-43-x86_64 fedora-44-x86_64 fedora-rawhide-x86_64}"

# Network access during builds ("on" or "off"). Packages that download their
# dependencies at build time (e.g. Rust crates for starship) need it.
COPR_ENABLE_NET="${COPR_ENABLE_NET:-on}"

COPR_DESCRIPTION="${COPR_DESCRIPTION:-Newer upstream releases of desktop tools for Fedora (btrfs-assistant, ...).}"
