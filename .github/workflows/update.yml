# Every 6 hours, and on each push that changes packages/: bump the specs in
# packages/ to the latest upstream releases, commit the bumps to master and
# build them in COPR, and rebuild any package whose latest COPR build is
# missing, outdated or failed (a failed one until MAX_FAILED_BUILDS in
# copr.conf have failed). Each built package's commit gets a "COPR build"
# status (the circle/checkmark/cross next to it on GitHub) that shows how its
# build went and links to it.
#
# Needs the repository secret COPR_CONFIG: the contents of your ~/.config/copr
# (API token from https://copr.fedorainfracloud.org/api/; it expires after
# 180 days, so renew the secret when it does). From 14 days before it expires,
# the run fails at the end with a reminder, so you get a mail in time.
name: Update packages

on:
  schedule:
    - cron: "23 */6 * * *"  # every 6 hours at :23 UTC (00:23, 06:23, 12:23, 18:23)
  workflow_dispatch:
  # Builds bumps pushed with "./pkg update" right away instead of on the next
  # scheduled run. The workflow's own pushes (with GITHUB_TOKEN) don't trigger
  # it again.
  push:
    branches: [master]
    paths: ["packages/**"]

permissions:
  contents: write
  statuses: write

concurrency:
  group: update-packages

jobs:
  update:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      # pkg uses it for the GitHub API (higher rate limit than anonymous).
      GITHUB_TOKEN: ${{ github.token }}
      # Name in the %changelog entries of the bumps.
      RPM_PACKAGER: Maarten van der Rijst <github@feedmebits.nl>
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git-core copr-cli rpmdevtools rpm-build jq

      - uses: actions/checkout@v7
        with:
          # The whole history: pkg check counts failed builds since each
          # package last changed, and statuses go on that commit.
          fetch-depth: 0

      # Before bumping anything, so an expired token shows up the day it
      # expires and no bump gets pushed that can't be built.
      - name: Check COPR login
        id: login
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::Add the contents of ~/.config/copr as the COPR_CONFIG repository secret."
            exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" >~/.config/copr
          if ! user="$(copr-cli whoami)"; then
            echo "::error::COPR login failed; renew the token at https://copr.fedorainfracloud.org/api/ and update the COPR_CONFIG secret."
            exit 1
          fi
          echo "Logged in to COPR as $user"

          # The config from the COPR API page has a "# expiration date: YYYY-MM-DD" line.
          expires="$(grep -oP '^#\s*expiration date:\s*\K\d{4}-\d{2}-\d{2}' <<<"$COPR_CONFIG" || true)"
          if [ -n "$expires" ]; then
            days=$(( ($(date -d "$expires" +%s) - $(date +%s)) / 86400 ))
            echo "COPR token expires on $expires ($days days)"
            echo "expires=$expires" >>"$GITHUB_OUTPUT"
            echo "days_left=$days" >>"$GITHUB_OUTPUT"
          fi

      - name: Bump specs to the latest upstream releases
        id: update
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 3: only skipped releases whose sources aren't downloadable yet;
          # they're retried on the next run (see SOURCE_GRACE_HOURS).
          lookup_failed=0 rc=0
          ./pkg update --no-push || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || lookup_failed=1

          # pkg commits each bump on its own; the next step pushes them.
          packages=""
          for sha in $(git rev-list --reverse "@{u}..HEAD"); do
            pkg="$(git diff-tree --no-commit-id --name-only -r "$sha" -- packages | cut -d/ -f2 | head -n1)"
            packages="$packages $pkg:$sha"
          done
          echo "packages=${packages# }" >>"$GITHUB_OUTPUT"
          echo "lookup_failed=$lookup_failed" >>"$GITHUB_OUTPUT"
          echo "Updated:${packages:- none}"

      - name: Push the bumps
        if: steps.update.outputs.packages != ''
        run: git push

      # Builds the bumps, and also rebuilds any package whose latest COPR build
      # isn't of its spec's version or failed (e.g. a COPR hiccup), so such a
      # build gets retried on the next run, until MAX_FAILED_BUILDS builds of
      # it have failed. Failures on rawhide (Fedora's development branch, often
      # broken for reasons outside the package) are only warnings.
      - name: Build in COPR
        run: |
          set -o pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Set the "COPR build" status of a commit: state, description, link.
          status() {
            curl -fsS -o /dev/null -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$1" \
              -d "$(jq -n --arg s "$2" --arg d "$3" --arg u "$4" \
                '{state: $s, description: $d, target_url: $u, context: "COPR build"}')" \
              || echo "::warning::Could not set the status of $1"
          }
          # The last commit that changed a package.
          commit_of() { git log -1 --format=%H -- "packages/$1"; }

          # The bumps (pushed above) and every package whose latest build is
          # missing, outdated or failed; the reasons go to the log.
          todo="$(./pkg check --todo)"
          if [ -z "$todo" ]; then
            echo "Nothing to build."
            exit 0
          fi

          for pkg in $todo; do
            status "$(commit_of "$pkg")" pending "Building in COPR" "$run_url"
          done
          failed=""
          for pkg in $todo; do
            sha="$(commit_of "$pkg")"
            echo "::group::Build $pkg"
            ./pkg build "$pkg" --nowait 2>&1 | tee build.log || true
            id="$(grep -oP 'Created builds: \K[0-9]+' build.log | head -n1)" || true
            if [ -n "$id" ]; then
              copr-cli watch-build "$id" || true
            fi
            echo "::endgroup::"
            if [ -n "$id" ] && ./pkg check "$pkg"; then
              state=success desc="Built in COPR"
            else
              state=failure desc="COPR build failed"
              failed="$failed $pkg"
            fi
            url="$run_url"
            [ -z "$id" ] || url="https://copr.fedorainfracloud.org/coprs/build/$id"
            status "$sha" "$state" "$desc" "$url"
          done
          if [ -n "$failed" ]; then
            echo "::error::COPR builds failed:$failed (see the build logs on COPR)"
            exit 1
          fi

      - name: Remind about the expiring COPR token
        if: ${{ !cancelled() && steps.login.outputs.days_left != '' && fromJSON(steps.login.outputs.days_left) <= 14 }}
        run: |
          echo "::error::The COPR token expires on ${{ steps.login.outputs.expires }}; renew it at https://copr.fedorainfracloud.org/api/ and update the COPR_CONFIG secret."
          exit 1

      - name: Report failed upstream lookups
        if: steps.update.outputs.lookup_failed == '1'
        run: |
          echo "::error::Could not update some packages (upstream lookup failed, or a release's sources are still missing); see the 'Bump specs' step."
          exit 1
