# Once a day: bump the specs in packages/ to the latest upstream releases,
# commit the bumps to master and build them in COPR, and rebuild any package
# whose latest COPR build is missing, outdated or failed. Each built package's
# commit gets a "COPR build" status (the circle/checkmark/cross next to it on
# GitHub) that shows how its build went and links to it.
#
# Needs the repository secret COPR_CONFIG: the contents of your ~/.config/copr
# (API token from https://copr.fedorainfracloud.org/api/; it expires after
# 180 days, so renew the secret when it does).
name: Update packages

on:
  schedule:
    - cron: "23 4 * * *"  # daily at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: update-packages

jobs:
  update:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      # copr.sh uses it for the GitHub API (higher rate limit than anonymous).
      GITHUB_TOKEN: ${{ github.token }}
      # Name in the %changelog entries of the bumps.
      RPM_PACKAGER: Maarten van der Rijst <github@feedmebits.nl>
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git-core copr-cli rpmdevtools rpm-build jq

      - uses: actions/checkout@v5

      # Before bumping anything, so an expired token shows up the day it
      # expires and no bump gets pushed that can't be built.
      - name: Check COPR login
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::Add the contents of ~/.config/copr as the COPR_CONFIG repository secret."
            exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" >~/.config/copr
          if ! user="$(copr-cli whoami)"; then
            echo "::error::COPR login failed; renew the token at https://copr.fedorainfracloud.org/api/ and update the COPR_CONFIG secret."
            exit 1
          fi
          echo "Logged in to COPR as $user"

      - name: Bump specs to the latest upstream releases
        id: update
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          lookup_failed=0
          ./copr.sh update || lookup_failed=1

          packages=""
          for pkg in $(git diff --name-only -- packages | cut -d/ -f2 | sort -u); do
            ver="$(rpmspec -q --srpm --qf '%{VERSION}\n' "packages/$pkg/$pkg.spec" | head -n1)"
            git commit -q -m "$pkg: update to $ver" -- "packages/$pkg"
            packages="$packages $pkg:$(git rev-parse HEAD)"
          done
          echo "packages=${packages# }" >>"$GITHUB_OUTPUT"
          echo "lookup_failed=$lookup_failed" >>"$GITHUB_OUTPUT"
          echo "Updated:${packages:- none}"

      - name: Push the bumps
        if: steps.update.outputs.packages != ''
        run: git push

      # Builds the bumps, and also rebuilds any package whose latest COPR build
      # isn't of its spec's version or failed (e.g. a COPR hiccup), so such a
      # build gets retried the next day. Failures on rawhide (Fedora's
      # development branch, often broken for reasons outside the package) are
      # only warnings, as in the test workflow.
      - name: Build in COPR
        env:
          BUMPED: ${{ steps.update.outputs.packages }}
        run: |
          set -o pipefail
          . ./copr.conf
          api="https://copr.fedorainfracloud.org/api_3"
          owner="$(copr-cli whoami)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Set the "COPR build" status of a commit: state, description, link.
          status() {
            curl -fsS -o /dev/null -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$1" \
              -d "$(jq -n --arg s "$2" --arg d "$3" --arg u "$4" \
                '{state: $s, description: $d, target_url: $u, context: "COPR build"}')" \
              || echo "::warning::Could not set the status of $1"
          }
          # Print the chroots of a COPR build that failed or were canceled.
          failed_chroots() {
            curl -fsSL "$api/build-chroot/list?build_id=$1" \
              | jq -r '.items[] | select(.state == "failed" or .state == "canceled") | .name'
          }
          # Succeed if a COPR build has no failures outside rawhide; warn about rawhide.
          chroots_ok() {
            local chroots chroot ok=0
            chroots="$(failed_chroots "$1")" || { echo "::warning::Could not check build $1"; return 1; }
            for chroot in $chroots; do
              if [[ "$chroot" == *rawhide* ]]; then
                echo "::warning::$pkg: failed on $chroot (build $1)"
              else
                echo "::error::$pkg: failed on $chroot, see https://copr.fedorainfracloud.org/coprs/build/$1"
                ok=1
              fi
            done
            return "$ok"
          }

          # What to build: "package:commit" for the bumps, then the packages whose
          # latest build isn't OK, with the last commit that changed them.
          todo="$BUMPED"
          builds="$(curl -fsSL "$api/package/list?ownername=$owner&projectname=$COPR_PROJECT&with_latest_build=true")"
          for spec in packages/*/*.spec; do
            pkg="$(basename "$spec" .spec)"
            case " $todo " in *" $pkg:"*) continue ;; esac
            want="$(rpmspec -q --srpm --define 'dist %{nil}' \
              --qf '%|EPOCH?{%{EPOCH}:}|%{VERSION}-%{RELEASE}\n' "$spec" | head -n1)"
            build="$(jq -c --arg p "$pkg" '.items[] | select(.name == $p) | .builds.latest // empty' <<<"$builds")"
            id="$(jq -r '.id // empty' <<<"$build")"
            have="$(jq -r '.source_package.version // empty' <<<"$build")"
            state="$(jq -r '.state // empty' <<<"$build")"
            if [ -z "$id" ]; then
              why="it was never built"
            elif [ "$have" != "$want" ]; then
              why="the latest build ($id) is $have, not $want"
            elif [ "$state" = failed ] && ! chroots_ok "$id" >/dev/null; then
              why="the latest build ($id) failed"
            else
              continue
            fi
            echo "Rebuilding $pkg: $why"
            todo="$todo $pkg:$(git log -1 --format=%H -- "packages/$pkg")"
          done
          todo="${todo# }"
          if [ -z "$todo" ]; then
            echo "Nothing to build."
            exit 0
          fi

          for entry in $todo; do
            status "${entry#*:}" pending "Building in COPR" "$run_url"
          done
          failed=""
          for entry in $todo; do
            pkg="${entry%%:*}" sha="${entry#*:}"
            echo "::group::Build $pkg"
            ./copr.sh build "$pkg" --nowait 2>&1 | tee build.log || true
            id="$(grep -oP 'Created builds: \K[0-9]+' build.log | head -n1)" || true
            if [ -n "$id" ]; then
              copr-cli watch-build "$id" || true
            fi
            echo "::endgroup::"
            if [ -n "$id" ] && chroots_ok "$id"; then
              state=success desc="Built in COPR"
            else
              state=failure desc="COPR build failed"
              failed="$failed $pkg"
            fi
            url="$run_url"
            [ -z "$id" ] || url="https://copr.fedorainfracloud.org/coprs/build/$id"
            status "$sha" "$state" "$desc" "$url"
          done
          if [ -n "$failed" ]; then
            echo "::error::COPR builds failed:$failed (see the build logs on COPR)"
            exit 1
          fi

      - name: Report failed upstream lookups
        if: steps.update.outputs.lookup_failed == '1'
        run: |
          echo "::error::Could not look up the latest release of some packages; see the 'Bump specs' step."
          exit 1
