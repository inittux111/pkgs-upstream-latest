# Upstream of this package, used by `./pkg list` and `update` to find new releases.
# shellcheck shell=bash
UPSTREAM="gitlab:mission-center-devs/mission-center"
# Chroots from copr.conf to skip: 1.2.0 needs GTK 4.22 and libadwaita 1.9
# (GNOME 50), which Fedora 43 doesn't have.
EXCLUDE_CHROOTS="fedora-43-x86_64"
